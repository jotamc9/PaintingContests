<div class="settings-page">
  <h1>Settings</h1>

  <section class="settings-group">
    <h2>Appearance</h2>

    <div class="setting-item">
      <label for="theme">Theme</label>
      <select
        #themeSelect
        [value]="themeService.theme()"
        (change)="themeService.setTheme(themeSelect.value === 'dark' ? 'dark' : 'light')"
      >
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="setting-item">
      <label for="language">Language</label>
      <select id="language">
        <option>English</option>
        <option>Spanish</option>
      </select>
    </div>
  </section>

  <section class="settings-group">
    <h2>Home</h2>

    <div class="setting-item">
      <label for="contests">Visible contests</label>
      <select id="contests">
        <option>1</option>
        <option>2</option>
        <option selected>3</option>
        <option>4</option>
        <option>5</option>
      </select>
    </div>

    <div class="setting-item">
      <label for="sorting">Sort contests by</label>
      <select id="sorting">
        <option>Closest</option>
        <option>Most Rewarded</option>
      </select>
    </div>
  </section>

  <section class="settings-group">
    <h2>Notifications</h2>

    <div class="setting-item">
      <label for="notifications"> Enable notifications </label>

      <input id="notifications" type="checkbox" />
    </div>
  </section>

  <div class="settings-actions">
    <button class="btn btn-secondary">Default Settings</button>

    <button class="btn btn-primary">Save</button>
  </div>
</div>
