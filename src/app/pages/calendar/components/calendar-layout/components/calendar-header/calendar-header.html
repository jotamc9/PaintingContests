<header class="calendar-toolbar">
  <div class="calendar-toolbar__date">
    <span class="calendar-toolbar__month">Junio</span>
    <span class="calendar-toolbar__year">2026</span>
  </div>

  <div class="calendar-toolbar__actions">
    <button class="calendar-toolbar__button" aria-label="Mes anterior">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <button class="calendar-toolbar__button" aria-label="Mes siguiente">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
</header>
